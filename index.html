<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCA Technical Inspection - Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Almarai:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --navy: #0d2546; --gold: #c5a059; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg); }

        .official-header {
            display: grid; grid-template-columns: 200px 1fr 200px;
            border: 2px solid #000; background: #fff;
            width: 1000px; margin: 20px auto; min-height: 120px;
        }
        .h-logo { display: flex; align-items: center; justify-content: center; padding: 10px; }
        .h-logo img { max-width: 100%; max-height: 100px; }
        .h-center { display: flex; flex-direction: column; text-align: center; justify-content: center; border-left: 2px solid #000; border-right: 2px solid #000; }
        .h-line-1 { font-size: 1.4rem; font-weight: bold; color: var(--navy); border-bottom: 2px solid #000; padding: 5px; }
        .h-line-3 { font-size: 1.6rem; font-weight: 900; background: #eee; flex-grow: 1; display: flex; align-items: center; justify-content: center; }

        .container { width: 1000px; margin: 0 auto; padding-bottom: 50px; }
        .screen { display: none; background: #fff; padding: 35px; border: 1px solid #ddd; border-radius: 12px; }
        .active { display: block; }

        .vsp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .vsp-card { background: #fff; padding: 30px; text-align: center; border: 2px solid #eee; font-size: 1.3rem; font-weight: bold; cursor: pointer; border-radius: 10px; transition: 0.3s; }
        .vsp-card.selected { background: var(--navy) !important; color: var(--gold) !important; }

        .region-card { border: 2px solid #000; margin-bottom: 15px; border-radius: 8px; overflow: hidden; background: #fff; }
        .region-main { display: flex; height: 70px; align-items: center; }
        .region-name { flex-grow: 1; border: none; background: transparent; font-size: 1.4rem; font-weight: bold; cursor: pointer; text-align: center; border-right: 2px solid #000; height: 100%; color: var(--navy); }
        .region-count-box { width: 110px; height: 100%; background: var(--gold); display: flex; align-items: center; justify-content: center; }
        .region-count-input { width: 100%; height: 100%; border: none; background: transparent; font-size: 2.2rem; font-weight: 900; text-align: center; outline: none; }
        
        .sub-fields { display: none; background: #fdfdfd; padding: 20px; border-top: 2px solid #000; }
        .sub-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .sub-row input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-weight: bold; }

        .parts-table { width: 100%; border-collapse: collapse; border: 2px solid #000; table-layout: fixed; }
        .parts-table th, .parts-table td { border: 2px solid #000 !important; padding: 5px; text-align: center; }
        .parts-table th { background: #eee; font-weight: bold; }
        .parts-table input { width: 100%; height: 35px; border: none; text-align: center; font-size: 1rem; font-weight: bold; outline: none; background: transparent; }

        .text-tools-bar { display: none; align-items: center; gap: 10px; background: #f8f9fa; padding: 8px 15px; border: 1px solid #ddd; border-radius: 8px; margin-right: 10px; }
        .text-tools-bar select, .text-tools-bar input { padding: 5px; border-radius: 4px; border: 1px solid #ccc; }

        .files-section { margin-top: 15px; border: 2px solid #000; border-radius: 5px; overflow: hidden; }
        .files-header { background: #333; color: white; padding: 10px; cursor: pointer; display: flex; justify-content: space-between; }
        .files-list { display: none; background: #fff; padding: 10px; list-style: none; margin: 0; }
        .file-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; }
        .file-item a { text-decoration: none; color: #007bff; font-weight: bold; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; }

        .btn { padding: 12px 25px; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .btn-edit { background: #f0f0f0; color: #333; border: 1px solid #ccc; }
        .is-editing .btn-edit { background: #27ae60 !important; color: white !important; }
        .btn-nav { background: var(--navy); color: white; }

        @media print { .no-print { display: none !important; } .screen { display: block !important; border:none; } .container { width: 100% !important; margin:0; } }
    </style>
</head>
<body>

    <header class="official-header">
        <div class="h-logo"><img src="image_5c761b.png"></div>
        <div class="h-center">
            <div class="h-line-1">SUEZ CANAL AUTHORITY</div>
            <div class="h-line-3">TECHNICAL INSPECTION REPORT</div>
        </div>
        <div class="h-logo"><img src="image_5c0103.png"></div>
    </header>

    <div class="container">
        <main id="scr1" class="screen active">
            <h2 style="text-align:center;">Select Unit</h2>
            <div class="vsp-grid" id="vspGrid"></div>
        </main>

        <main id="scr2" class="screen">
            <div class="no-print" style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div style="display:flex; align-items: center;">
                    <button class="btn btn-edit" id="btnEdit2" onclick="toggleEdit(2)">✎ EDIT MODE</button>
                    <div id="tools2" class="text-tools-bar">
                        <select id="font2" onchange="applyStyle(2)">
                            <option value="'Segoe UI'">Default</option>
                            <option value="'Cairo'">Cairo</option>
                            <option value="'Tajawal'">Tajawal</option>
                            <option value="'Almarai'">Almarai</option>
                        </select>
                        <input type="number" id="size2" value="22" style="width:55px" onchange="applyStyle(2)">
                        <input type="color" id="color2" value="#0d2546" onchange="applyStyle(2)">
                    </div>
                </div>
                <h2 id="vspLabel">Unit</h2>
                <button class="btn btn-nav" onclick="nav(1)">BACK</button>
            </div>
            <div id="regionsContainer"></div>
        </main>

        <main id="scr3" class="screen">
            <div class="no-print" style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div style="display:flex; align-items: center;">
                    <button class="btn btn-edit" id="btnEdit3" onclick="toggleEdit(3)">✎ EDIT REPORT</button>
                    <div id="tools3" class="text-tools-bar">
                        <select id="font3" onchange="applyStyle(3)">
                            <option value="'Segoe UI'">Default</option>
                            <option value="'Cairo'">Cairo</option>
                            <option value="'Tajawal'">Tajawal</option>
                            <option value="'Roboto'">Roboto</option>
                        </select>
                        <input type="number" id="size3" value="16" style="width:55px" onchange="applyStyle(3)">
                        <input type="color" id="color3" value="#000000" onchange="applyStyle(3)">
                        <div id="fileWrapper" style="display:none; border-left:1px solid #ccc; padding-left:10px;">
                            <label for="fileIn" style="cursor:pointer; background:var(--gold); color:white; padding:5px 10px; border-radius:4px; font-size:12px;">📎 Attach</label>
                            <input type="file" id="fileIn" hidden multiple onchange="handleFileUpload(this)">
                        </div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <h2 id="partLabel" style="margin:0;">Spare Part</h2>
                    <input type="number" id="rowsLimit" value="30" onchange="updateRowsLimit(this.value)" style="width:50px; text-align:center; border:2px solid var(--gold);">
                </div>
                <button class="btn btn-nav" onclick="nav(2)">BACK</button>
            </div>

            <table class="parts-table">
                <thead>
                    <tr><th style="width:50px;">No.</th><th>Part Name</th><th style="width:80px;">Qty.</th><th style="width:160px;">Part No.</th></tr>
                </thead>
                <tbody id="partsTableBody"></tbody>
            </table>

            <div class="files-section">
                <div class="files-header" onclick="toggleFiles()">
                    <span>📁 Files (<span id="fileCount">0</span>)</span>
                    <span>▼</span>
                </div>
                <ul class="files-list" id="attachedFileList"></ul>
            </div>

            <textarea id="noteVal" style="width:100%; height:100px; margin-top:15px; border:2px solid #000; padding:10px; font-weight:bold;" placeholder="Notes..."></textarea>
            <button class="btn no-print" style="width:100%; margin-top:20px; background:#000; color:#fff;" onclick="window.print()">PRINT TO PDF</button>
        </main>
    </div>

    <script>
        // استرجاع اللوكال ستورج فوراً - كل جهاز له داتا خاصة
        let db = JSON.parse(localStorage.getItem('sca_local_v1')) || { 
            units:['VSP 10','VSP 12','VSP 14','VSP 16','VSP 24','VSP 28','VSP 32'], 
            storage:{}, 
            last:null 
        };
        
        let curU='', curRIdx=-1, isEdit=false;

        function save() { localStorage.setItem('sca_local_v1', JSON.stringify(db)); }

        function init() { 
            document.getElementById('vspGrid').innerHTML = db.units.map(u => 
                `<div class="vsp-card ${u===db.last?'selected':''}" onclick="nav(2,'${u}')">${u}</div>`
            ).join(''); 
        }

        function nav(s, v) {
            document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
            document.getElementById('scr'+s).classList.add('active');
            if(s===2 && v) { curU=v; db.last=v; save(); renderReg(); }
            if(s===3) { if(typeof v === 'number') curRIdx=v; renderParts(); }
            isEdit = false; updateUI(s);
        }

        function renderReg() {
            const c = document.getElementById('regionsContainer');
            if(!db.storage[curU]) db.storage[curU] = [{name:'Main Area', code:1, subs:[''], parts:[], note:'', rowsLimit: 30, style:{}, files:[]}];
            c.innerHTML = db.storage[curU].map((r, i) => `
                <div class="region-card">
                    <div class="region-main">
                        ${isEdit?`<button style="background:red; color:white; border:none; width:40px; height:100%; cursor:pointer;" onclick="remR(${i})">X</button>`:''}
                        <button class="region-name" onclick="goRep(${i})" style="font-family:${r.style?.font || 'inherit'}; font-size:${r.style?.size || '1.4rem'}; color:${r.style?.color || 'var(--navy)'};">
                            ${isEdit?`<input type="text" value="${r.name}" style="width:90%; border:none; text-align:center; font-weight:bold; color:inherit; font-size:inherit;" onchange="upN(${i},this.value)" onclick="event.stopPropagation()">`:r.name}
                        </button>
                        <div class="region-count-box" onclick="handleGoldClick(${i})">
                            <input type="number" class="region-count-input" value="${r.code}" ${isEdit ? '' : 'readonly'} onchange="autoSubs(${i}, this.value)" onclick="event.stopPropagation()">
                        </div>
                    </div>
                    <div id="sub-box-${i}" class="sub-fields">
                        ${(r.subs || []).map((s, si) => `<div class="sub-row"><span>${si+1}.</span><input type="text" value="${s}" ${isEdit?'':'disabled'} onchange="upSub(${i},${si},this.value)"></div>`).join('')}
                    </div>
                </div>
            `).join('') + (isEdit?`<button class="btn" style="width:100%; background:#27ae60; color:white; margin-top:10px;" onclick="addR()">+ Add New Area</button>`:'');
        }

        function renderParts() {
            const r = db.storage[curU][curRIdx];
            const limit = r.rowsLimit || 30;
            const style = r.style3 || {font: "'Segoe UI'", size: 16, color: "#000000"};
            const b = document.getElementById('partsTableBody'); b.innerHTML = '';
            for(let i=0; i < limit; i++) {
                const p = (r.parts && r.parts[i]) ? r.parts[i] : {n:'', q:'', pn:''};
                b.innerHTML += `<tr><td>${i+1}</td>
                    <td><input type="text" value="${p.n||''}" ${isEdit?'':'disabled'} onchange="upP(${i},'n',this.value)" style="font-family:${style.font}; font-size:${style.size}px; color:${style.color}; text-align:left; padding-left:10px;"></td>
                    <td><input type="text" value="${p.q||''}" ${isEdit?'':'disabled'} onchange="upP(${i},'q',this.value)" style="font-family:${style.font}; font-size:${style.size}px; color:${style.color};"></td>
                    <td><input type="text" value="${p.pn||''}" ${isEdit?'':'disabled'} onchange="upP(${i},'pn',this.value)" style="font-family:${style.font}; font-size:${style.size}px; color:${style.color};"></td></tr>`;
            }
            document.getElementById('noteVal').value = r.note || '';
            document.getElementById('partLabel').innerText = r.name;
            renderFilesList();
        }

        function handleFileUpload(input) {
            const r = db.storage[curU][curRIdx];
            if(!r.files) r.files = [];
            Array.from(input.files).forEach(f => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    r.files.push({ name: f.name, data: e.target.result });
                    save(); renderFilesList();
                };
                reader.readAsDataURL(f);
            });
        }

        function renderFilesList() {
            const r = db.storage[curU][curRIdx];
            const list = document.getElementById('attachedFileList');
            const count = document.getElementById('fileCount');
            if(!r.files || r.files.length === 0) { list.innerHTML = '<li>No files.</li>'; count.innerText = "0"; return; }
            count.innerText = r.files.length;
            list.innerHTML = r.files.map((f, i) => `
                <li class="file-item">
                    <span>📄</span>
                    <a href="${f.data}" download="${f.name}">${f.name}</a>
                    ${isEdit?`<button onclick="remFile(${i})" style="color:red; border:none; background:none; cursor:pointer;">Delete</button>`:''}
                </li>
            `).join('');
        }

        function remFile(i) { db.storage[curU][curRIdx].files.splice(i,1); save(); renderFilesList(); }
        function toggleFiles() { const l = document.getElementById('attachedFileList'); l.style.display = (l.style.display==='block')?'none':'block'; }

        function applyStyle(screen) {
            const f = document.getElementById('font'+screen).value;
            const s = document.getElementById('size'+screen).value;
            const c = document.getElementById('color'+screen).value;
            if(screen === 2) db.storage[curU].forEach(r => r.style = {font:f, size:s+'px', color:c});
            else db.storage[curU][curRIdx].style3 = {font:f, size:s, color:c};
            save(); renderParts(); if(screen===2) renderReg();
        }

        function toggleEdit(s) { isEdit = !isEdit; updateUI(s); if(!isEdit) save(); }
        
        function updateUI(s) {
            const btn = document.getElementById('btnEdit'+s); if(btn) btn.innerText = isEdit?"✔ SAVE DATA":"✎ EDIT MODE";
            const tools = document.getElementById('tools'+s); if(tools) tools.style.display = isEdit ? 'flex' : 'none';
            if(s===3) { document.getElementById('fileWrapper').style.display = isEdit ? 'block' : 'none'; renderParts(); }
            if(s===2) renderReg();
        }

        function handleGoldClick(idx) { if(!isEdit) { let el = document.getElementById('sub-box-'+idx); el.style.display = (el.style.display === 'block') ? 'none' : 'block'; } }
        function autoSubs(idx, val) {
            let num = Math.max(0, parseInt(val) || 0);
            let r = db.storage[curU][idx];
            while(r.subs.length < num) r.subs.push('');
            r.subs = r.subs.slice(0, num); r.code = num;
            save(); renderReg(); document.getElementById('sub-box-'+idx).style.display = 'block'; 
        }

        function updateRowsLimit(v) { db.storage[curU][curRIdx].rowsLimit = v; save(); renderParts(); }
        function goRep(i) { if(!isEdit) { curRIdx=i; nav(3); } }
        function upN(i,v) { db.storage[curU][i].name=v; save(); }
        function upSub(i,si,v) { db.storage[curU][i].subs[si]=v; save(); }
        function upP(i,k,v) { 
            if(!db.storage[curU][curRIdx].parts[i]) db.storage[curU][curRIdx].parts[i]={n:'',q:'',pn:''}; 
            db.storage[curU][curRIdx].parts[i][k]=v; save(); 
        }
        function addR() { db.storage[curU].push({name:'New Area', code:1, subs:[''], parts:[], note:'', rowsLimit: 30, style:{}, files:[]}); renderReg(); }
        function remR(i) { if(confirm("Delete Area?")) { db.storage[curU].splice(i,1); save(); renderReg(); } }
        document.getElementById('noteVal').oninput = (e) => { db.storage[curU][curRIdx].note = e.target.value; save(); };

        init();
    </script>
</body>
</html>
